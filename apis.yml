aid: qogita
name: Qogita
description: >-
  Qogita is Europe's B2B wholesale marketplace for the health and beauty
  sector, connecting retailers to a combined catalog of more than 500 suppliers
  and distributors and over 10,000 brands with guaranteed authenticity for EU
  and UK retail. Qogita handles sourcing, ordering, payment, and logistics
  across borders, and exposes a REST API at api.qogita.com (documented at
  developers.qogita.com) alongside a hosted, OAuth-protected Model Context
  Protocol (MCP) server for agent access. The company is backed by Accel and
  Bessemer Venture Partners.
